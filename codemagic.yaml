workflows:
  flutter-apk-ipa:
    name: Build APK and IPA
    environment:
      flutter: stable
      xcode: latest
      vars:
        APP_VERSION: 3.29.0
        BUILD_NUMBER: 1
      groups:
        - app_store_credentials # Secure credentials group in Codemagic UI
    scripts:
      - name: Set version
        script: |
          flutter pub get
          # flutter pub run flutter_launcher_icons:main
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter version
          flutter build apk --release 
          flutter build ios --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/ios/iphoneos/Runner.app
      - build/ios/archive/*.xcarchive
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - parthunagar9@gmail.com
